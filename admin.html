<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — VastMyWealth</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0A1128; --navy-light: #123166; --royal-blue: #1E4FD8; --sky-blue: #3FA9E0;
  --gold: #F5A623; --white: #FFFFFF; --grey-bg: #F4F6FA; --grey-mid: #6B7280;
  --grey-dark: #1F2937; --border-light: #E5E9F0; --error-red: #D64545; --success-green: #1E9E5A;
  --font-display: 'Poppins', sans-serif; --font-body: 'Inter', sans-serif;
  --radius-md: 14px; --radius-sm: 8px;
  --shadow-soft: 0 8px 24px rgba(10,17,40,0.08); --shadow-card: 0 4px 14px rgba(10,17,40,0.06);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-body); color: var(--grey-dark); background: var(--grey-bg); line-height: 1.5; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; display: block; }
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; border: none; }
input, select, textarea { font-family: inherit; }
.container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

.site-header { background: var(--navy); padding: 16px 0; }
.site-header .container { display: flex; align-items: center; justify-content: space-between; }
.logo-link { display: flex; align-items: center; gap: 10px; }
.logo-img { height: 40px; width: 40px; border-radius: 50%; }
.logo-text { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; color: var(--white); }
.admin-tag { color: rgba(255,255,255,0.55); font-size: 0.78rem; margin-left: 4px; }
.logout-link { color: rgba(255,255,255,0.75); font-size: 0.85rem; font-weight: 600; }
.logout-link:hover { color: var(--white); }

/* Login screen */
.login-wrap { min-height: calc(100vh - 74px); display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.login-card { background: var(--white); border-radius: var(--radius-md); box-shadow: var(--shadow-soft); padding: 36px 30px; width: 100%; max-width: 380px; }
.login-card h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; color: var(--navy); margin-bottom: 6px; }
.login-card .login-sub { color: var(--grey-mid); font-size: 0.9rem; margin-bottom: 24px; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 7px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border-light); border-radius: var(--radius-sm); font-size: 0.95rem; transition: border-color 0.2s ease; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--sky-blue); }
.form-group textarea { resize: vertical; min-height: 64px; }
.btn { padding: 12px 20px; border-radius: 999px; font-family: var(--font-display); font-weight: 700; font-size: 0.88rem; transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-primary { background: var(--gold); color: var(--navy); box-shadow: 0 8px 18px rgba(245,166,35,0.3); width: 100%; }
.btn-primary:hover:not(:disabled) { transform: translateY(-2px); }
.btn-secondary { background: var(--white); color: var(--navy); border: 1.5px solid var(--border-light); }
.btn-secondary:hover:not(:disabled) { border-color: var(--royal-blue); }
.btn-small { padding: 8px 14px; font-size: 0.78rem; }

.form-status { text-align: center; font-size: 0.88rem; padding: 11px; border-radius: var(--radius-sm); margin-bottom: 18px; display: none; }
.form-status.visible { display: block; }
.form-status.error { background: rgba(214,69,69,0.08); color: var(--error-red); }
.form-status.success { background: rgba(30,158,90,0.08); color: var(--success-green); }
.form-status.loading { background: rgba(63,169,224,0.08); color: var(--sky-blue); }

/* Admin dashboard */
#adminApp { display: none; }
.toolbar { padding: 26px 0 18px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.search-box { flex: 1; min-width: 220px; display: flex; gap: 10px; }
.search-box input { flex: 1; padding: 12px 16px; border: 1.5px solid var(--border-light); border-radius: 999px; font-size: 0.92rem; }
.search-box input:focus { outline: none; border-color: var(--sky-blue); }

.summary-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.summary-chip { background: var(--white); border: 1px solid var(--border-light); border-radius: 999px; padding: 7px 16px; font-size: 0.8rem; font-weight: 600; color: var(--grey-mid); }
.summary-chip strong { color: var(--navy); }

.app-table-wrap { background: var(--white); border-radius: var(--radius-md); box-shadow: var(--shadow-card); overflow: hidden; margin-bottom: 40px; }
.app-row { padding: 16px 20px; border-bottom: 1px solid var(--border-light); cursor: pointer; }
.app-row:last-child { border-bottom: none; }
.app-row:hover { background: var(--grey-bg); }
.app-row-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.app-row-main { display: flex; flex-direction: column; gap: 2px; }
.app-row-name { font-weight: 700; color: var(--navy); font-size: 0.95rem; }
.app-row-sub { font-size: 0.8rem; color: var(--grey-mid); }
.status-badge { font-size: 0.75rem; font-weight: 700; padding: 4px 12px; border-radius: 999px; white-space: nowrap; }
.status-Draft { background: #EDEFF3; color: var(--grey-mid); }
.status-Submitted, .status-Under.Review { background: rgba(30,79,216,0.1); color: var(--royal-blue); }
.status-Docs.Pending { background: rgba(245,166,35,0.12); color: #B67210; }
.status-Sanctioned, .status-Disbursed { background: rgba(30,158,90,0.12); color: var(--success-green); }
.status-Rejected { background: rgba(214,69,69,0.1); color: var(--error-red); }

.app-detail { display: none; padding: 18px 20px 22px; background: var(--grey-bg); border-top: 1px dashed var(--border-light); }
.app-detail.expanded { display: block; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 24px; font-size: 0.86rem; margin-bottom: 18px; }
@media (max-width: 640px) { .detail-grid { grid-template-columns: 1fr; } }
.detail-grid .klabel { color: var(--grey-mid); }
.detail-grid .kvalue { color: var(--grey-dark); font-weight: 600; word-break: break-word; }

.action-panel { background: var(--white); border-radius: var(--radius-sm); padding: 16px; margin-top: 10px; }
.action-panel h4 { font-family: var(--font-display); font-size: 0.85rem; color: var(--royal-blue); margin-bottom: 12px; }
.action-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
.action-row .form-group { flex: 1; min-width: 160px; margin-bottom: 0; }

.empty-state { background: var(--white); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: 50px 24px; text-align: center; color: var(--grey-mid); }

.loading-screen { text-align: center; padding: 60px 20px; color: var(--grey-mid); }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--navy); color: var(--white); padding: 12px 22px; border-radius: 999px; font-size: 0.88rem; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease; z-index: 100; }
.toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: var(--error-red); }

a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--sky-blue); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<!-- LOGIN SCREEN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <h1>Admin Login</h1>
    <p class="login-sub">Enter your mobile number and PIN.</p>
    <div class="form-status" id="loginStatus"></div>
    <form id="adminLoginForm" novalidate>
      <div class="form-group">
        <label for="adminMobile">Mobile Number</label>
        <input type="tel" id="adminMobile" maxlength="10" inputmode="numeric" placeholder="10-digit mobile number">
      </div>
      <div class="form-group">
        <label for="adminPin">4-Digit PIN</label>
        <input type="password" id="adminPin" maxlength="4" inputmode="numeric" placeholder="••••">
      </div>
      <button type="submit" class="btn btn-primary" id="adminLoginBtn">Log In</button>
    </form>
  </div>
</div>

<!-- ADMIN DASHBOARD -->
<div id="adminApp">
  <div class="container">
    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search by name, mobile, PAN, or Application ID">
        <button class="btn btn-secondary" id="searchBtn">Search</button>
      </div>
      <button class="btn btn-secondary" id="exportBtn">Export to CSV</button>
    </div>

    <div class="summary-bar" id="summaryBar"></div>

    <div id="resultsContainer">
      <div class="loading-screen">Loading applications...</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbztQKJ7aD7jW4K4Si54XOCBhTbu_vtMjoNYYU_MYfwRfvL_NzpWzBlgEgE33oPQHi32YA/exec';

let ADMIN_TOKEN = localStorage.getItem('vmw_admin_token') || null;
let EXECUTIVES = [];
let ALL_APPLICATIONS = [];

const STATUS_OPTIONS = ['Draft', 'Submitted', 'Under Review', 'Docs Pending', 'Sanctioned', 'Disbursed', 'Rejected'];

function callApi(payload) {
  if (ADMIN_TOKEN) payload.token = ADMIN_TOKEN;
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload)
  }).then(function (res) { return res.json(); });
}

const toast = document.getElementById('toast');
function showToast(message, isError) {
  toast.textContent = message;
  toast.className = 'toast visible' + (isError ? ' error' : '');
  setTimeout(function () { toast.className = 'toast'; }, 2600);
}

/* ============================================================
   LOGIN
   ============================================================ */
const loginWrap = document.getElementById('loginWrap');
const adminApp = document.getElementById('adminApp');
const logoutLink = document.getElementById('logoutLink');
const loginStatus = document.getElementById('loginStatus');

function showStatus(el, message, type) {
  el.textContent = message;
  el.className = 'form-status visible ' + type;
}
function clearStatusEl(el) { el.className = 'form-status'; }

document.getElementById('adminLoginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  clearStatusEl(loginStatus);

  const mobile = document.getElementById('adminMobile').value.trim();
  const pin = document.getElementById('adminPin').value.trim();
  const btn = document.getElementById('adminLoginBtn');

  if (!/^[6-9]\d{9}$/.test(mobile) || !/^\d{4}$/.test(pin)) {
    showStatus(loginStatus, 'Enter a valid mobile number and 4-digit PIN.', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Logging in...';
  showStatus(loginStatus, 'Checking credentials...', 'loading');

  callApi({ action: 'adminLogin', mobile: mobile, pin: pin }).then(function (response) {
    btn.disabled = false;
    btn.textContent = 'Log In';

    if (!response.success) {
      showStatus(loginStatus, response.error || 'Login failed.', 'error');
      return;
    }

    ADMIN_TOKEN = response.data.token;
    localStorage.setItem('vmw_admin_token', ADMIN_TOKEN);
    enterAdminApp();
  }).catch(function () {
    btn.disabled = false;
    btn.textContent = 'Log In';
    showStatus(loginStatus, 'Connection issue. Please try again.', 'error');
  });
});

logoutLink.addEventListener('click', function (e) {
  e.preventDefault();
  localStorage.removeItem('vmw_admin_token');
  ADMIN_TOKEN = null;
  location.reload();
});

function enterAdminApp() {
  loginWrap.style.display = 'none';
  adminApp.style.display = 'block';
  logoutLink.style.display = 'inline';
  loadExecutives();
  loadApplications('');
}

/* ============================================================
   LOAD DATA
   ============================================================ */
function loadExecutives() {
  callApi({ action: 'adminGetExecutives' }).then(function (response) {
    if (response.success) EXECUTIVES = response.data.executives || [];
  });
}

function loadApplications(query) {
  document.getElementById('resultsContainer').innerHTML = '<div class="loading-screen">Loading applications...</div>';
  callApi({ action: 'adminSearch', query: query || '' }).then(function (response) {
    if (!response.success) {
      if (response.error && response.error.indexOf('expired') !== -1) {
        localStorage.removeItem('vmw_admin_token');
        location.reload();
        return;
      }
      document.getElementById('resultsContainer').innerHTML = '<div class="empty-state">' + (response.error || 'Could not load applications.') + '</div>';
      return;
    }
    ALL_APPLICATIONS = response.data.applications || [];
    renderSummary(ALL_APPLICATIONS);
    renderApplicationList(ALL_APPLICATIONS);
  }).catch(function () {
    document.getElementById('resultsContainer').innerHTML = '<div class="empty-state">Connection issue. Please reload the page.</div>';
  });
}

document.getElementById('searchBtn').addEventListener('click', function () {
  loadApplications(document.getElementById('searchInput').value.trim());
});
document.getElementById('searchInput').addEventListener('keypress', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); loadApplications(this.value.trim()); }
});

/* ============================================================
   SUMMARY CHIPS
   ============================================================ */
function renderSummary(applications) {
  const counts = {};
  applications.forEach(function (app) {
    const s = app.Status || 'Draft';
    counts[s] = (counts[s] || 0) + 1;
  });
  const chipsHtml = '<div class="summary-chip">Total: <strong>' + applications.length + '</strong></div>' +
    Object.keys(counts).map(function (status) {
      return '<div class="summary-chip">' + status + ': <strong>' + counts[status] + '</strong></div>';
    }).join('');
  document.getElementById('summaryBar').innerHTML = chipsHtml;
}

/* ============================================================
   APPLICATION LIST + INLINE DETAIL PANEL
   ============================================================ */
function statusClass(status) { return 'status-' + String(status || 'Draft').replace(/ /g, '.'); }

function formatDate(value) {
  if (!value) return '—';
  const d = new Date(value);
  if (isNaN(d.getTime())) return String(value);
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function renderApplicationList(applications) {
  const container = document.getElementById('resultsContainer');

  if (!applications || applications.length === 0) {
    container.innerHTML = '<div class="empty-state">No applications found.</div>';
    return;
  }

  const rowsHtml = applications.map(function (app, index) {
    return (
      '<div class="app-row" data-index="' + index + '">' +
        '<div class="app-row-top" onclick="toggleDetail(' + index + ')">' +
          '<div class="app-row-main">' +
            '<span class="app-row-name">' + (app.Full_Name || 'Unnamed') + ' — ' + (app.Loan_Product || '') + '</span>' +
            '<span class="app-row-sub">' + app.Application_ID + ' &middot; ' + (app.Mobile_Number || '') + '</span>' +
          '</div>' +
          '<span class="status-badge ' + statusClass(app.Status) + '">' + (app.Status || 'Draft') + '</span>' +
        '</div>' +
        '<div class="app-detail" id="detail_' + index + '"></div>' +
      '</div>'
    );
  }).join('');

  container.innerHTML = '<div class="app-table-wrap">' + rowsHtml + '</div>';
}

function toggleDetail(index) {
  const detailEl = document.getElementById('detail_' + index);
  const isExpanded = detailEl.classList.contains('expanded');

  document.querySelectorAll('.app-detail.expanded').forEach(function (el) { el.classList.remove('expanded'); el.innerHTML = ''; });

  if (isExpanded) return;

  const app = ALL_APPLICATIONS[index];
  detailEl.innerHTML = buildDetailHtml(app, index);
  detailEl.classList.add('expanded');
}

function buildDetailHtml(app, index) {
  const infoFields = [
    ['PAN', app.PAN_Number], ['Email', app.Email], ['DOB', app.DOB],
    ['Current Address', app.Current_Address], ['Employment', app.Employment_Type],
    ['Employer', app.Employer_Name], ['Monthly Income', app.Monthly_Income],
    ['Loan Amount', app.Loan_Amount], ['Purpose', app.Purpose],
    ['Bank', app.Bank_Name], ['Account No.', app.Account_Number],
    ['Reference 1', app.Reference1_Name ? (app.Reference1_Name + ' (' + app.Reference1_Mobile + ')') : ''],
    ['Reference 2', app.Reference2_Name ? (app.Reference2_Name + ' (' + app.Reference2_Mobile + ')') : ''],
    ['Created', formatDate(app.Created_Date)], ['Last Updated', formatDate(app.Last_Updated)]
  ];

  const infoHtml = infoFields.filter(function (f) { return f[1]; }).map(function (f) {
    return '<div class="klabel">' + f[0] + '</div><div class="kvalue">' + f[1] + '</div>';
  }).join('');

  const statusOptionsHtml = STATUS_OPTIONS.map(function (s) {
    return '<option value="' + s + '"' + (s === app.Status ? ' selected' : '') + '>' + s + '</option>';
  }).join('');

  const execOptionsHtml = '<option value="">— Unassigned —</option>' + EXECUTIVES.map(function (ex) {
    return '<option value="' + ex.Name + '"' + (ex.Name === app.Assigned_Executive ? ' selected' : '') + '>' + ex.Name + '</option>';
  }).join('');

  return (
    '<div class="detail-grid">' + infoHtml + '</div>' +

    '<div class="action-panel">' +
      '<h4>Update Status</h4>' +
      '<div class="action-row">' +
        '<div class="form-group"><select id="statusSelect_' + index + '">' + statusOptionsHtml + '</select></div>' +
        '<button class="btn btn-primary btn-small" onclick="updateStatus(' + index + ')">Update Status</button>' +
      '</div>' +
    '</div>' +

    '<div class="action-panel">' +
      '<h4>Assign Executive / Bank</h4>' +
      '<div class="action-row">' +
        '<div class="form-group"><select id="execSelect_' + index + '">' + execOptionsHtml + '</select></div>' +
        '<div class="form-group"><input type="text" id="bankInput_' + index + '" placeholder="Bank / NBFC name" value="' + (app.Assigned_Bank || '') + '"></div>' +
        '<button class="btn btn-primary btn-small" onclick="updateAssignment(' + index + ')">Save Assignment</button>' +
      '</div>' +
    '</div>' +

    '<div class="action-panel">' +
      '<h4>Remarks</h4>' +
      '<div class="form-group"><textarea id="remarkInput_' + index + '" placeholder="Add a remark...">' + (app.Remarks || '') + '</textarea></div>' +
      '<button class="btn btn-primary btn-small" onclick="updateRemark(' + index + ')">Save Remark</button>' +
    '</div>'
  );
}

/* ============================================================
   ADMIN ACTIONS
   ============================================================ */
function updateStatus(index) {
  const app = ALL_APPLICATIONS[index];
  const status = document.getElementById('statusSelect_' + index).value;

      app.Status = status;
      loadApplications(document.getElementById('searchInput').value.trim());
    } else {
      showToast(response.error || 'Update failed.', true);
    }
  });
}

/* ============================================================
   EXPORT TO CSV (no external library — built with plain JS)
   ============================================================ */
document.getElementById('exportBtn').addEventListener('click', function () {
  callApi({ action: 'adminExport' }).then(function (response) {
    if (!response.success) {
      showToast(response.error || 'Export failed.', true);
      return;
    }
    downloadCsv(response.data.applications);
  });
});

function downloadCsv(applications) {
  if (!applications || applications.length === 0) {
    showToast('No data to export.', true);
    return;
  }
  const headers = Object.keys(applications[0]);
  const rows = applications.map(function (app) {
    return headers.map(function (h) {
      let val = app[h] === undefined || app[h] === null ? '' : String(app[h]);
      val = val.replace(/"/g, '""');
      return '"' + val + '"';
    }).join(',');
  });
  const csvContent = headers.map(function (h) { return '"' + h + '"'; }).join(',') + '\n' + rows.join('\n');

  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'VastMyWealth_Applications_' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
  showToast('Export downloaded.');
}
