<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VastMyWealth Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-1:#0A1730; --navy-2:#122a56; --navy-3:#173768;
  --panel:#152B54; --panel-border:rgba(212,165,74,.35);
  --gold:#D9A94E; --gold-deep:#B8863B; --gold-light:#F2DFB0;
  --ink:#0F1E3D;
  --text-onnavy:#EDF1FA; --text-onnavy-muted:#A9B8DA;
  --input-bg:#FFFFFF; --input-border:#D8DCE8; --rust:#E4776B;
  --font-display:'Poppins',sans-serif; --font-body:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html, body{ height:100%; }
body{
  font-family:var(--font-body);
  background:linear-gradient(180deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:var(--text-onnavy);
  display:flex; flex-direction:column;
  min-height:100vh; min-height:100dvh;
  overflow:hidden;
}

header{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; flex-shrink:0; }
.brand{ display:flex; align-items:center; gap:10px; }
.logo-img{ width:38px; height:38px; border-radius:50%; }
.wordmark{ font-family:var(--font-display); font-weight:800; font-size:16px; color:#fff; }
.wordmark .script{ font-family:'Segoe Script','Brush Script MT',cursive; font-weight:400; font-style:italic; color:#7FB0FF; margin-left:3px; }
.partner-btn{ background:transparent; border:1.5px solid var(--gold); color:var(--gold-light); font-size:12px; font-weight:700; padding:8px 14px; border-radius:20px; cursor:pointer; text-decoration:none; white-space:nowrap; }
.partner-btn:active{ background:rgba(217,169,78,.15); }

main{ flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:10px 24px; text-align:center; overflow-y:auto; }

h1{ font-family:var(--font-display); font-weight:800; font-size:24px; line-height:1.3; color:#fff; margin-bottom:8px; }
h1 .gold{ color:var(--gold); }
.hero-sub{ font-size:13px; color:var(--text-onnavy-muted); margin-bottom:26px; max-width:340px; }

.cta-stack{ width:100%; max-width:340px; display:flex; flex-direction:column; gap:12px; }
.cta-btn{ width:100%; padding:16px; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; font-family:var(--font-body); border:none; }
.cta-primary{ background:linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%); color:var(--ink); box-shadow:0 6px 16px rgba(217,169,78,.35); }
.cta-secondary{ background:rgba(255,255,255,.05); color:#fff; border:1.5px solid rgba(255,255,255,.35); }

.trust-line{ margin-top:22px; font-size:11px; color:var(--text-onnavy-muted); }

/* ===== LOGIN OVERLAY (Track Application) ===== */
.overlay{ display:none; position:fixed; inset:0; background:rgba(6,12,28,.85); align-items:center; justify-content:center; padding:20px; z-index:50; }
.overlay.show{ display:flex; }
.login-card{ background:var(--panel); border:1px solid var(--panel-border); border-radius:14px; padding:24px 20px; width:100%; max-width:340px; }
.login-card h2{ font-family:var(--font-display); font-size:17px; color:#fff; margin-bottom:16px; text-align:center; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:11px; font-weight:700; color:var(--gold-light); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
.field input{ width:100%; padding:12px; border:1.5px solid var(--input-border); border-radius:9px; font-size:14.5px; background:var(--input-bg); color:var(--ink); }
.field input:focus{ outline:none; border-color:var(--gold); }
.btn-auth{ width:100%; padding:14px; background:linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%); color:var(--ink); border:none; border-radius:10px; font-size:14.5px; font-weight:700; cursor:pointer; margin-top:4px; }
.btn-auth:disabled{ background:#4a5578; color:#9aa5c4; cursor:not-allowed; }
.error-msg{ font-size:12px; color:var(--rust); margin-top:8px; display:none; font-weight:600; }
.error-msg.show{ display:block; }
.close-link{ text-align:center; font-size:12px; color:var(--text-onnavy-muted); margin-top:14px; cursor:pointer; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img class="logo-img" src="data:image/png;base64,iVBORw0KGgo..." alt="VastMyWealth">
    <div class="wordmark">VastMyWealth<span class="script">Digital</span></div>
  </div>
  <a class="partner-btn" href="https://loan.vastmywealth.com/partner-login.html">Partner Login</a>
</header>

<main>
  <h1>Apply Directly.<br><span class="gold">Get Matched Smarter.</span></h1>
  <p class="hero-sub">One application, multiple lender options — 100% digital, no middlemen.</p>

  <div class="cta-stack">
    <button class="cta-btn cta-primary" onclick="window.location.href=APPLICATION_PAGE">Start New Application</button>
    <button class="cta-btn cta-secondary" onclick="showLogin()">Track My Application</button>
  </div>

  <div class="trust-line">🔒 Your documents are encrypted and shared only with selected lenders.</div>
</main>

<div class="overlay" id="loginOverlay">
  <div class="login-card">
    <h2>Track Your Application</h2>
    <div class="field">
      <label>Mobile Number</label>
      <input type="text" id="li_mobile" maxlength="10" inputmode="numeric" placeholder="10-digit mobile number">
    </div>
    <div class="field">
      <label>4-Digit PIN</label>
      <input type="password" id="li_pin" maxlength="4" inputmode="numeric" placeholder="••••">
    </div>
    <div class="error-msg" id="loginError"></div>
    <button class="btn-auth" id="loginBtn" onclick="submitLogin()">Login</button>
    <div class="close-link" onclick="hideLogin()">Cancel</div>
  </div>
</div>

<script>
var BACKEND_URL = "https://script.google.com/macros/s/AKfycbwGTSTzKTJYrhx2wP3UuBPG_64g-ZczNPhem3-PfcPPu8AYQaT0MvSgz1FsyRdoonVndg/exec";
var APPLICATION_PAGE = "portal-unified-application.html";

function fetchJsonRetry(url, options, attemptsLeft){
  attemptsLeft = (attemptsLeft === undefined) ? 2 : attemptsLeft;
  return fetch(url, options)
    .then(function(r){ return r.text(); })
    .then(function(raw){
      try { return JSON.parse(raw); }
      catch(e){ throw new Error('Non-JSON response: ' + raw.slice(0,120)); }
    })
    .catch(function(err){
      if (attemptsLeft > 1) {
        return new Promise(function(resolve){ setTimeout(resolve, 900); })
          .then(function(){ return fetchJsonRetry(url, options, attemptsLeft - 1); });
      }
      throw err;
    });
}

function showLogin(){ document.getElementById('loginOverlay').classList.add('show'); }
function hideLogin(){ document.getElementById('loginOverlay').classList.remove('show'); }

function submitLogin(){
  var mobile = document.getElementById('li_mobile').value.replace(/\D/g,'');
  var pin = document.getElementById('li_pin').value;
  var errEl = document.getElementById('loginError');
  errEl.classList.remove('show');

  if (mobile.length !== 10 || !/^\d{4}$/.test(pin)) {
    errEl.textContent = 'Please enter a valid mobile number and 4-digit PIN.';
    errEl.classList.add('show');
    return;
  }

  var btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Logging in…';

  fetchJsonRetry(BACKEND_URL + '?action=loginAccount&mobile=' + encodeURIComponent(mobile) + '&pin=' + encodeURIComponent(pin))
    .then(function(d){
      if (d.success) {
        sessionStorage.setItem('vmw_mobile', mobile);
        sessionStorage.setItem('vmw_flow', 'login');
        window.location.href = APPLICATION_PAGE;
      } else {
        btn.disabled = false; btn.textContent = 'Login';
        errEl.textContent = d.error || 'Invalid mobile number or PIN.';
        errEl.classList.add('show');
      }
    })
    .catch(function(err){
      btn.disabled = false; btn.textContent = 'Login';
      errEl.textContent = 'Connection error — please try again. (' + err.message + ')';
      errEl.classList.add('show');
    });
}
</script>
</body>
</html>
